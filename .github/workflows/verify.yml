name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: typecheck + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24, not 20. Two hard floors sit above 20 and both fail at module
      # load rather than in a test, which makes them look like flakes:
      #   - jsdom 30 -> undici 8 reads `markAsUncloneable` off node:worker_threads
      #     at require time. It landed in Node 22.10, so on 20 every test file
      #     using the jsdom environment dies with "not a function" before it runs.
      #   - scripts/smoke.mjs speaks CDP over the global WebSocket, unflagged from
      #     Node 22 only, so on 20 it aborts with "WebSocket is not defined".
      # jsdom's own engines field is ^22.22.2 || ^24.15.0 || >=26.0.0.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run verify

      # The packaged artefact is built by the same code path users download,
      # so a broken zip step fails CI rather than release day.
      - run: npm run zip

      - uses: actions/upload-artifact@v5
        with:
          name: night-neutralizer-unpacked
          path: dist/
          if-no-files-found: error

  smoke:
    name: end-to-end in real Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # See the note in the verify job: the smoke script needs the global
      # WebSocket, which is only unflagged from Node 22.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome; scripts/smoke.mjs
      # discovers it automatically, CHROME_PATH is only a manual override.
      - run: npm run smoke
